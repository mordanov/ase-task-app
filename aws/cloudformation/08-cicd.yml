AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM OIDC provider and role for GitHub Actions.
  Run this stack ONCE — it's shared across environments.

Parameters:
  ProjectName:
    Type: String
    Default: keycloak-app
  GitHubOrg:
    Type: String
    Description: GitHub organization or username (e.g. myorg)
  GitHubRepo:
    Type: String
    Description: GitHub repository name (e.g. keycloak-app)

Resources:
  # GitHub OIDC provider — allows GitHub Actions to assume IAM roles without static credentials
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-github-actions
      Description: Role assumed by GitHub Actions for deployments
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Allow push to main AND workflow_dispatch from any branch
                # (so "dev" environment deploys via manual trigger work too)
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/*
      Policies:
        # ── ECR ──────────────────────────────────────────────────────────────
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                Resource:
                  - !Sub arn:aws:ecr:*:${AWS::AccountId}:repository/${ProjectName}-*

        # ── ECS service deployments ───────────────────────────────────────────
        - PolicyName: ECSDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:DescribeClusters
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*-task-*-role
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*-task-execution-role

        # ── S3 frontend assets ────────────────────────────────────────────────
        - PolicyName: S3FrontendDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:CreateBucket
                  - s3:PutBucketTagging
                Resource:
                  - !Sub arn:aws:s3:::${ProjectName}-*-frontend-*
                  - !Sub arn:aws:s3:::${ProjectName}-*-frontend-*/*

        # ── CloudFront distribution + cache invalidation ──────────────────────
        - PolicyName: CloudFrontManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListDistributions
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:TagResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateCachePolicy
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:DeleteCachePolicy
                  - cloudfront:CreateOriginRequestPolicy
                  - cloudfront:UpdateOriginRequestPolicy
                  - cloudfront:GetOriginRequestPolicy
                  - cloudfront:DeleteOriginRequestPolicy
                Resource: '*'

        # ── Route53 (DNS alias for custom domain) ─────────────────────────────
        - PolicyName: Route53RecordManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                Resource: '*'

        # ── Secrets Manager (Keycloak secrets + OriginVerifySecret) ──────────
        - PolicyName: SecretsManagerManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                  - secretsmanager:GetRandomPassword
                Resource:
                  - !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:/${ProjectName}/*

        # ── Application Auto Scaling (Keycloak ECS scaling policies) ─────────
        - PolicyName: AutoScalingManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:DeregisterScalableTarget
                  - application-autoscaling:PutScalingPolicy
                  - application-autoscaling:DeleteScalingPolicy
                  - application-autoscaling:DescribeScalableTargets
                  - application-autoscaling:DescribeScalingPolicies
                Resource: '*'

        # ── CloudFormation — read (all jobs) + deploy (deploy-infra job) ──────
        - PolicyName: CloudFormationManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read access — needed by every job to fetch stack outputs
              - Sid: CloudFormationRead
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStackResources
                Resource: '*'
              # Deploy access — needed by deploy-infra job only (scoped to this project's stacks)
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ProjectName}-*

        # ── ACM — read certificate ARN for CloudFormation parameters ─────────
        - PolicyName: ACMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:GetCertificate
                Resource: '*'

Outputs:
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
    Description: Add this value as AWS_ROLE_ARN GitHub Actions secret
    Export:
      Name: !Sub ${ProjectName}-GitHubActionsRoleArn
