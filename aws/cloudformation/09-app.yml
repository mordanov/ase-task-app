AWSTemplateFormatVersion: '2010-09-09'
Description: Application ECS Fargate service — the main user-facing app after authentication

Parameters:
  ProjectName:
    Type: String
    Default: keycloak-app
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  AppImageTag:
    Type: String
    Default: latest
  AppPort:
    Type: Number
    Default: 3000
    Description: Port the application container listens on
  DesiredCount:
    Type: Number
    Default: 0
    Description: Set to 0 until the first image is pushed to ECR; then set to 1+
  MinCapacity:
    Type: Number
    Default: 0
  MaxCapacity:
    Type: Number
    Default: 10

Resources:
  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${Environment}-app
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn:
        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-TaskExecutionRoleArn
      TaskRoleArn:
        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-TaskRoleArn
      ContainerDefinitions:
        - Name: app
          Image: !Sub
            - '${RepoUri}:${Tag}'
            - RepoUri:
                Fn::ImportValue: !Sub ${ProjectName}-${Environment}-AppRepoUri
              Tag: !Ref AppImageTag
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: !Sub '${AppPort}'
            - Name: KEYCLOAK_URL
              Value: !Sub
                - 'http://${AlbDns}'
                - AlbDns:
                    Fn::ImportValue: !Sub ${ProjectName}-${Environment}-AlbDnsName
            - Name: KEYCLOAK_REALM
              Value: app-realm
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DbEndpoint
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DbPort
            - Name: DB_NAME
              Value: keycloakapp
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: REDIS_URL
              Value: !Sub
                - 'rediss://${Endpoint}:6379/0'
                - Endpoint:
                    Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CacheEndpoint
            - Name: EMR_APPLICATION_ID
              Value:
                Fn::ImportValue: !Sub ${ProjectName}-${Environment}-SparkApplicationId
            - Name: SPARK_BUCKET
              Value:
                Fn::ImportValue: !Sub ${ProjectName}-${Environment}-SparkBucket
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn:
                    Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DbSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${ProjectName}-${Environment}-AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'curl -sf http://localhost:${AppPort}/health || exit 1'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${ProjectName}-${Environment}-app
      Cluster:
        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ClusterArn
      TaskDefinition: !Ref AppTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub ${ProjectName}-${Environment}-PrivateSubnet1Id
            - Fn::ImportValue: !Sub ${ProjectName}-${Environment}-PrivateSubnet2Id
          SecurityGroups:
            - Fn::ImportValue: !Sub ${ProjectName}-${Environment}-EcsSgId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref AppPort
          TargetGroupArn:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-AppTgArn
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCapacity
      MinCapacity: !Ref MinCapacity
      ResourceId: !Sub
        - 'service/${Cluster}/${Service}'
        - Cluster:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ClusterName
          Service: !GetAtt AppService.Name
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  AppCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-${Environment}-app-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AppScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60.0
        ScaleInCooldown: 120
        ScaleOutCooldown: 30

Outputs:
  AppServiceName:
    Value: !GetAtt AppService.Name
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AppServiceName
